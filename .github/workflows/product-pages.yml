name: Publish product page

on:
  push:
    branches: [master]
    paths:
      - 'frontend/public/product/**'
      - '.github/workflows/product-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check static JavaScript
        run: node --check frontend/public/product/demo.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static product page
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/public/product
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "podcast-manager-backend"
version = "0.1.0"
description = "Local-first Podcast Knowledge Pipeline backend"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Flask>=2.3.0",
    "flask-cors>=4.0.0",
    "pymongo>=4.5.0",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    "tavily-python>=0.5.0",
    "openai>=1.0.0",
    "python-dateutil>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.1.0", "imageio-ffmpeg>=0.6.0"]
local-whisperx = [
    "whisperx==3.8.5",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "imageio-ffmpeg>=0.6.0",
]
cloud-transcription = ["assemblyai>=0.35.0"]
pdf = ["markdown>=3.5.0", "weasyprint>=60.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
